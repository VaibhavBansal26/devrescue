name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: "Install (torch not needed; model code imports it lazily)"
        run: pip install pytest fastapi "sqlalchemy>=2" httpx "pydantic>=2" datasets
      - run: pytest -q
